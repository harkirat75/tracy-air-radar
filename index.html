<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracy Air Radar</title>
<style>
:root{color-scheme:light;--ink:#18334a;--muted:#6d8799;--line:#b9d3e2;--blue:#2b82b9;--bg:#f5fbff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
.wrap{width:100%;height:100%;min-height:280px;display:grid;place-items:center;padding:8px}
.panel{width:min(100%,560px);aspect-ratio:1/1;position:relative;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0,#f2f9fd 70%,#e8f3f9 100%);border:1px solid #d6e7f0;box-shadow:0 8px 28px #244b6412;overflow:hidden}
canvas{display:block;width:100%;height:100%}.head{position:absolute;top:8%;left:0;right:0;text-align:center;pointer-events:none}.title{font-size:clamp(11px,2.6vw,16px);font-weight:750;letter-spacing:.18em}.sub{font-size:clamp(8px,1.8vw,10px);color:var(--muted);letter-spacing:.08em;margin-top:3px}.foot{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(8px,1.7vw,10px);color:var(--muted);pointer-events:none}.status{position:absolute;right:16%;top:17%;font-size:clamp(8px,1.6vw,10px);color:#347a9f;background:#e7f4fae8;border:1px solid #cde5f1;border-radius:20px;padding:4px 8px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#35a77a;margin-right:5px;vertical-align:1px}.error .dot{background:#d28b39}
</style></head>
<body><div class="wrap"><div class="panel" id="panel"><canvas id="radar" aria-label="Live aircraft radar"></canvas><div class="head"><div class="title">TRACY AIR RADAR</div><div class="sub">95377 · NORTH UP · LIVE ADS-B</div></div><div class="status" id="status"><span class="dot"></span>Connecting</div><div class="foot" id="foot">RANGE 25 KM · AIRCRAFT RECEIVED FROM PUBLIC ADS-B FEED</div></div></div>
<script>
(()=>{
// Approximate ZIP-area center, not a private street address.
const HOME={lat:37.7397,lon:-121.4252};
const RANGE_KM=25, FETCH_KM=40, REFRESH_MS=15000;
const canvas=document.getElementById('radar'),ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'),foot=document.getElementById('foot');
let aircraft=[],history=new Map(),lastUpdate=null,loading=false;
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function xy(lat,lon){const north=(lat-HOME.lat)*111.32;const east=(lon-HOME.lon)*111.32*Math.cos(HOME.lat*Math.PI/180);const s=(canvas.clientWidth*.39)/RANGE_KM;return {x:canvas.clientWidth/2+east*s,y:canvas.clientHeight/2-north*s,dist:Math.hypot(east,north)}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,R=w*.39;
// subtle radar rings and cardinal guides
ctx.save();ctx.strokeStyle='#b9d3e2';ctx.lineWidth=1;[.25,.5,.75,1].forEach(f=>{ctx.beginPath();ctx.arc(cx,cy,R*f,0,Math.PI*2);ctx.stroke()});ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#6d8799';ctx.font=`${Math.max(8,w*.022)}px system-ui`;ctx.textAlign='center';ctx.fillText('N',cx,cy-R-7);ctx.fillText('S',cx,cy+R+14);ctx.textAlign='left';ctx.fillText('W',cx-R-14,cy+3);ctx.textAlign='right';ctx.fillText('E',cx+R+14,cy+3);
// prior positions form short, fading trails
for(const [hex,pts] of history){if(pts.length<2)continue;ctx.beginPath();pts.forEach((p,i)=>{const q=xy(p.lat,p.lon);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.strokeStyle='#4c9bc455';ctx.lineWidth=1.5;ctx.stroke()}
// home marker
ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#244b64';ctx.fill();ctx.beginPath();ctx.moveTo(cx-8,cy-2);ctx.lineTo(cx,cy-10);ctx.lineTo(cx+8,cy-2);ctx.strokeStyle='#244b64';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#244b64';ctx.font=`600 ${Math.max(8,w*.022)}px system-ui`;ctx.textAlign='center';ctx.fillText('HOME AREA',cx,cy+20);
let shown=0;for(const a of aircraft){if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;const p=xy(a.lat,a.lon);if(p.dist>RANGE_KM)continue;shown++;const track=Number.isFinite(a.track)?a.track:0;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(track*Math.PI/180);ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4.5,5);ctx.lineTo(0,2.5);ctx.lineTo(-4.5,5);ctx.closePath();ctx.fillStyle='#247eae';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
ctx.restore();foot.textContent=`${shown} AIRCRAFT WITHIN ${RANGE_KM} KM · ZIP-CENTERED APPROXIMATION`;
}
async function update(){if(loading)return;loading=true;try{const url=`https://api.adsb.lol/v2/lat/${HOME.lat}/lon/${HOME.lon}/dist/${FETCH_KM}`;const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`Feed returned ${res.status}`);const data=await res.json();aircraft=Array.isArray(data.aircraft)?data.aircraft:[];const now=Date.now();for(const a of aircraft){if(!a.hex||!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;const pts=history.get(a.hex)||[];pts.push({lat:a.lat,lon:a.lon,t:now});while(pts.length>5)pts.shift();history.set(a.hex,pts)}for(const [hex,pts] of history){if(now-pts[pts.length-1].t>120000)history.delete(hex)}lastUpdate=now;statusEl.classList.remove('error');statusEl.innerHTML='<span class="dot"></span>LIVE · UPDATED';draw()}catch(e){statusEl.classList.add('error');statusEl.innerHTML='<span class="dot"></span>FEED UNAVAILABLE';foot.textContent='CHECK INTERNET CONNECTION · RETRYING AUTOMATICALLY'}finally{loading=false}}
new ResizeObserver(resize).observe(canvas);resize();update();setInterval(update,REFRESH_MS);
})();
</script></body></html>
