<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracy Air Radar — Map View</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
.wrap{width:250px;height:250px;max-width:100vw;max-height:100vh;position:relative;margin:0 auto}
#map{width:250px;height:250px;border-radius:50%;overflow:hidden;border:2px solid #d6e5ef;box-shadow:0 3px 16px #203b5030;background:#dceaf2}
.leaflet-container{font:10px Arial,sans-serif}
.leaflet-control-attribution{font-size:7px!important;background:#ffffffc9!important}
.leaflet-control-attribution a{color:#245b78!important}
.head{position:absolute;z-index:1000;top:13px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 1px 3px white,0 -1px 3px white}
.title{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#153c55}
.sub{font-size:7px;letter-spacing:.5px;color:#315d75;margin-top:2px}
.foot{position:absolute;z-index:1000;bottom:17px;left:0;right:0;text-align:center;pointer-events:none;font-size:8px;font-weight:700;color:#183e56;text-shadow:0 1px 3px white,0 -1px 3px white}
.pill{display:inline-block;padding:2px 6px;border-radius:10px;background:#ffffffd9}
.status{position:absolute;z-index:1001;right:25px;top:38px;font-size:7px;color:#174e3d;background:#eafff2e8;border-radius:8px;padding:3px 5px;pointer-events:none}
.status.bad{color:#8b3c22;background:#fff0e8e8}
.plane-icon{background:transparent;border:0}
.plane-glyph{display:block;font-size:18px;line-height:20px;text-align:center;transform-origin:50% 50%;filter:drop-shadow(0 1px 1px white) drop-shadow(0 0 2px white);font-weight:bold}
.home-icon{font-size:15px;line-height:18px;text-align:center;filter:drop-shadow(0 1px 2px white)}
@media(max-width:249px){.wrap,#map{width:100%;height:100%}}
</style>
</head>
<body>
<div class="wrap">
 <div id="map" aria-label="Live aircraft map centered near Tracy California"></div>
 <div class="head"><div class="title">TRACY AIR RADAR</div><div class="sub">95377 · 50 KM RADIUS</div></div>
 <div class="status" id="status">CONNECTING</div>
 <div class="foot"><span class="pill" id="count">WAITING FOR AIRCRAFT DATA</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const HOME=[37.7397,-121.4252],RANGE_KM=50,FETCH_NM=33,REFRESH_MS=60000;
const statusEl=document.getElementById('status'),countEl=document.getElementById('count');
if(!window.L){statusEl.textContent='MAP LIBRARY FAILED';statusEl.className='status bad';return;}
const map=L.map('map',{zoomControl:false,attributionControl:true,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,keyboard:false,touchZoom:false}).setView(HOME,8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const rangeCircle=L.circle(HOME,{radius:RANGE_KM*1000,color:'#087fb5',weight:1.5,opacity:.85,fillColor:'#55b9e8',fillOpacity:.07,dashArray:'4 4'}).addTo(map);
map.fitBounds(rangeCircle.getBounds(),{padding:[9,9]});
const homeIcon=L.divIcon({className:'home-icon',html:'🏠',iconSize:[20,20],iconAnchor:[10,10]});
L.marker(HOME,{icon:homeIcon,interactive:false,zIndexOffset:1000}).addTo(map);
let markers=new Map(),trails=new Map(),loading=false;
function colorFor(a){
 const alt=typeof a.alt_baro==='number'?a.alt_baro:0;
 if(alt>30000)return '#7b3fc6';
 if(alt>18000)return '#1676d2';
 if(alt>8000)return '#079b87';
 return '#e87520';
}
function makeIcon(a){
 const color=colorFor(a),track=Number.isFinite(a.track)?a.track:0;
 return L.divIcon({className:'plane-icon',html:`<span class="plane-glyph" style="color:${color};transform:rotate(${track}deg)">✈</span>`,iconSize:[22,22],iconAnchor:[11,11]});
}
async function getFeed(){
 const endpoint=`https://api.adsb.lol/v2/lat/${HOME[0]}/lon/${HOME[1]}/dist/${FETCH_NM}`;
 let response;
 try{response=await fetch(endpoint,{cache:'no-store'});}
 catch(e){response=await fetch('https://corsproxy.io/?url='+encodeURIComponent(endpoint),{cache:'no-store'});}
 if(!response.ok)throw new Error('Feed HTTP '+response.status);
 return await response.json();
}
async function refresh(){
 if(loading)return;loading=true;
 try{
  const data=await getFeed(),list=Array.isArray(data.aircraft)?data.aircraft:[];
  const seen=new Set();let visible=0;
  for(const a of list){
   if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;
   const dlat=(a.lat-HOME[0])*111.32,dlon=(a.lon-HOME[1])*111.32*Math.cos(HOME[0]*Math.PI/180);
   if(Math.hypot(dlat,dlon)>RANGE_KM)continue;
   const id=a.hex||`${a.lat},${a.lon}`;seen.add(id);visible++;
   const latlng=[a.lat,a.lon];
   if(markers.has(id)){markers.get(id).setLatLng(latlng).setIcon(makeIcon(a));}
   else markers.set(id,L.marker(latlng,{icon:makeIcon(a),title:a.flight||a.hex||'Aircraft',keyboard:false}).addTo(map));
   const label=(a.flight||a.hex||'Aircraft').trim();
   markers.get(id).bindTooltip(label,{direction:'top',offset:[0,-8]});
   const old=trails.get(id)||[];
   old.push(latlng);while(old.length>4)old.shift();trails.set(id,old);
  }
  for(const [id,m] of markers){if(!seen.has(id)){map.removeLayer(m);markers.delete(id);trails.delete(id);}}
  statusEl.textContent='LIVE · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  statusEl.className='status';
  countEl.textContent=visible+' AIRCRAFT · 50 KM RANGE';
 }catch(err){
  statusEl.textContent='FLIGHT FEED OFFLINE';statusEl.className='status bad';
  countEl.textContent='MAP IS LIVE · AIRCRAFT DATA UNAVAILABLE';
 }
 finally{loading=false;}
}
refresh();setInterval(refresh,REFRESH_MS);
setTimeout(()=>map.invalidateSize(),500);
})();
</script>
</body>
</html>
