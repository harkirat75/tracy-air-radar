<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracy Air Radar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
.wrap{width:250px;height:250px;max-width:100vw;max-height:100vh;position:relative;margin:0 auto}
#map{width:250px;height:250px;border-radius:50%;overflow:hidden;border:2px solid #d6e5ef;box-shadow:0 3px 16px #203b5030;background:#dceaf2}
.leaflet-container{font:10px Arial,sans-serif}.leaflet-control-attribution{font-size:7px!important;background:#ffffffc9!important}
.head{position:absolute;z-index:1000;top:12px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 1px 3px white,0 -1px 3px white}
.title{font-size:10px;font-weight:800;letter-spacing:1.1px;color:#153c55}.sub{font-size:7px;letter-spacing:.5px;color:#315d75;margin-top:2px}
.foot{position:absolute;z-index:1000;bottom:16px;left:0;right:0;text-align:center;pointer-events:none;font-size:8px;font-weight:700;color:#183e56;text-shadow:0 1px 3px white,0 -1px 3px white}
.pill{display:inline-block;padding:3px 6px;border-radius:10px;background:#ffffffdf}
.status{position:absolute;z-index:1001;right:22px;top:37px;font-size:7px;color:#174e3d;background:#eafff2ed;border-radius:8px;padding:3px 5px;pointer-events:none}
.status.bad{color:#8b3c22;background:#fff0e8ed}
.plane-icon{background:transparent;border:0}.plane-glyph{display:block;font-size:19px;line-height:22px;text-align:center;transform-origin:50% 50%;filter:drop-shadow(0 1px 2px white) drop-shadow(0 0 2px white);font-weight:bold}
.home-icon{font-size:16px;line-height:20px;text-align:center;filter:drop-shadow(0 1px 2px white)}
</style>
</head>
<body>
<div class="wrap">
 <div id="map" aria-label="Live aircraft map centered near Tracy California"></div>
 <div class="head"><div class="title">TRACY AIR RADAR</div><div class="sub">95377 · 50 KM RADIUS</div></div>
 <div class="status" id="status">LOADING MAP</div>
 <div class="foot"><span class="pill" id="count">STARTING…</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const HOME=[37.7397,-121.4252],RANGE_KM=50,RADIUS_NM=27,REFRESH_MS=90000;
const statusEl=document.getElementById('status'),countEl=document.getElementById('count');
if(!window.L){statusEl.textContent='MAP LIBRARY BLOCKED';statusEl.className='status bad';countEl.textContent='CHECK CDN / INTERNET';return;}
const map=L.map('map',{zoomControl:false,attributionControl:true,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,keyboard:false,touchZoom:false}).setView(HOME,8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const rangeCircle=L.circle(HOME,{radius:RANGE_KM*1000,color:'#087fb5',weight:1.5,opacity:.9,fillColor:'#55b9e8',fillOpacity:.06,dashArray:'4 4'}).addTo(map);
map.fitBounds(rangeCircle.getBounds(),{padding:[8,8]});
L.marker(HOME,{icon:L.divIcon({className:'home-icon',html:'🏠',iconSize:[20,20],iconAnchor:[10,10]}),interactive:false,zIndexOffset:1000}).addTo(map);
let markers=new Map(),loading=false;
function planeColor(a){const alt=typeof a.alt_baro==='number'?a.alt_baro:0;if(alt>=30000)return '#7b3fc6';if(alt>=15000)return '#1676d2';if(alt>=5000)return '#079b87';return '#e87520';}
function iconFor(a){const c=planeColor(a),hdg=Number.isFinite(a.track)?a.track:0;return L.divIcon({className:'plane-icon',html:`<span class="plane-glyph" style="color:${c};transform:rotate(${hdg}deg)">✈</span>`,iconSize:[24,24],iconAnchor:[12,12]});}
async function fetchAircraft(){
 const api=`https://api.adsb.lol/v2/point/${HOME[0]}/${HOME[1]}/${RADIUS_NM}`;
 const urls=[`https://proxy.cors.dev/${api}`,`https://corsproxy.io/?url=${encodeURIComponent(api)}`];
 let last;
 for(const url of urls){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.ac))throw new Error('Unexpected aircraft feed format');return d.ac;}catch(e){last=e;}}
 throw last||new Error('Aircraft feed unavailable');
}
async function refresh(){
 if(loading)return;loading=true;
 try{
  const aircraft=await fetchAircraft(),seen=new Set();let n=0;
  for(const a of aircraft){
   if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon))continue;
   const dy=(a.lat-HOME[0])*111.32,dx=(a.lon-HOME[1])*111.32*Math.cos(HOME[0]*Math.PI/180);
   if(Math.hypot(dx,dy)>RANGE_KM)continue;
   const id=a.hex||`${a.lat},${a.lon}`;seen.add(id);n++;
   const pos=[a.lat,a.lon],label=(a.flight||a.hex||'Aircraft').trim();
   if(markers.has(id))markers.get(id).setLatLng(pos).setIcon(iconFor(a));
   else markers.set(id,L.marker(pos,{icon:iconFor(a),title:label,keyboard:false}).addTo(map));
   markers.get(id).bindTooltip(label,{direction:'top',offset:[0,-8]});
  }
  for(const [id,m] of markers)if(!seen.has(id)){map.removeLayer(m);markers.delete(id);}
  statusEl.textContent='LIVE · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});statusEl.className='status';
  countEl.textContent=n+' AIRCRAFT · 50 KM';
 }catch(e){
  statusEl.textContent='FLIGHT FEED ERROR';statusEl.className='status bad';
  countEl.textContent='MAP OK · FEED NOT CONNECTED';
  console.warn('Aircraft feed error:',e);
 }finally{loading=false;}
}
setTimeout(()=>map.invalidateSize(),400);refresh();setInterval(refresh,REFRESH_MS);
})();
</script>
</body></html>
